# Diagnoses Windows screen capture (d3d11screencapturesrc) on a real
# Windows desktop: element capabilities, which caps link, and a real-capture
# end-to-end session. Runs when this file or the capture/media code changes.
name: Windows capture check

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/windows-capture-debug.yml"
      - "crates/media-engine/**"
      - "crates/capture-api/**"
  workflow_dispatch:

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: GStreamer
        run: choco install -y --no-progress gstreamer gstreamer-devel pkgconfiglite
      - name: Locate GStreamer
        shell: pwsh
        run: |
          $root = @([Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine"), "C:\Program Files\gstreamer\1.0\msvc_x86_64") |
            Where-Object { $_ -and (Test-Path (Join-Path $_ "lib\pkgconfig")) } | Select-Object -First 1
          $root = $root.TrimEnd("\")
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$(Join-Path $root 'lib\pkgconfig')" >> $env:GITHUB_ENV
          (Join-Path $root "bin") >> $env:GITHUB_PATH

      - name: Element details
        shell: pwsh
        run: |
          gst-inspect-1.0 --version
          gst-inspect-1.0 d3d11screencapturesrc
          gst-inspect-1.0 d3d11convert | Select-String -Pattern "SRC template|SINK template|Capabilities|memory:|format:" -Context 0,1 | Select-Object -First 30

      - name: Which pipelines work
        shell: pwsh
        continue-on-error: true
        run: |
          $tests = [ordered]@{
            "plain"                         = 'd3d11screencapturesrc num-buffers=10 ! fakesink'
            "d3d11 caps + framerate"        = 'd3d11screencapturesrc num-buffers=10 ! "video/x-raw(memory:D3D11Memory),framerate=60/1" ! fakesink'
            "d3d11 caps, no framerate"      = 'd3d11screencapturesrc num-buffers=10 ! "video/x-raw(memory:D3D11Memory)" ! fakesink'
            "system memory caps"            = 'd3d11screencapturesrc num-buffers=10 ! "video/x-raw,framerate=60/1" ! fakesink'
            "download + convert I420"       = 'd3d11screencapturesrc num-buffers=10 ! "video/x-raw(memory:D3D11Memory)" ! d3d11download ! videoconvertscale ! "video/x-raw,format=I420,width=1280,height=720" ! fakesink'
            "d3d11convert NV12 (GPU path)"  = 'd3d11screencapturesrc num-buffers=10 ! d3d11convert ! "video/x-raw(memory:D3D11Memory),format=NV12,width=1280,height=720" ! fakesink'
            "videorate 60"                  = 'd3d11screencapturesrc num-buffers=20 ! videorate drop-only=true max-rate=60 ! fakesink'
          }
          foreach ($t in $tests.GetEnumerator()) {
            $out = cmd /c "gst-launch-1.0 -q $($t.Value) 2>&1"
            "{0,-32} exit {1}  {2}" -f $t.Key, $LASTEXITCODE, (($out | Select-Object -Last 2) -join " | ")
          }
          "--- negotiated caps of the plain pipeline:"
          cmd /c 'gst-launch-1.0 -v d3d11screencapturesrc num-buffers=3 ! fakesink 2>&1' | Select-String "caps =" | Select-Object -First 4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capture-debug
      - name: Build
        run: |
          cargo build --release -p mist-app-core --bin mist
          cargo build --release -p mist-signaling-server
      - name: Real screen capture end to end (x264 and the default encoder)
        shell: pwsh
        run: |
          $env:MIST_BIN_DIR = "$PWD\target\release"
          $env:GST_DEBUG = "2,d3d11screencapturesrc:4"
          python tests/e2e/e2e.py --audio test-tone --duration 8 --host-config 'host.encoder="x264enc"'
          $a = $LASTEXITCODE
          python tests/e2e/e2e.py --audio test-tone --duration 8
          $b = $LASTEXITCODE
          "x264: $a, default encoder: $b"
          if ($a -ne 0 -or $b -ne 0) { throw "real-capture session failed" }
