# Builds the Windows installer, installs it on the runner and checks that the
# installed copy works on its own (system GStreamer hidden), then uploads it.
# Tags v* additionally publish a GitHub release with the installer.
name: Windows installer

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0), created at the run's commit. Empty: build and test only."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: GStreamer (MSVC runtime + development)
        run: choco install -y --no-progress gstreamer gstreamer-devel pkgconfiglite
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Locate GStreamer
        shell: pwsh
        run: |
          $candidates = @(
            [Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine"),
            "C:\Program Files\gstreamer\1.0\msvc_x86_64",
            "C:\gstreamer\1.0\msvc_x86_64"
          )
          $root = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ "lib\pkgconfig")) } | Select-Object -First 1
          if (-not $root) { throw "GStreamer MSVC x86_64 development files not found" }
          $root = $root.TrimEnd("\")
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" >> $env:GITHUB_ENV
          "GST_ROOT=$root" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$(Join-Path $root 'lib\pkgconfig')" >> $env:GITHUB_ENV
          (Join-Path $root "bin") >> $env:GITHUB_PATH
          & (Join-Path $root "bin\gst-launch-1.0.exe") --version

      - name: Build the streaming client sidecar and the test server
        shell: pwsh
        run: |
          cargo build --release -p mist-app-core --bin mist
          cargo build --release -p mist-signaling-server
          New-Item -ItemType Directory -Force apps\desktop\src-tauri\binaries | Out-Null
          Copy-Item target\release\mist.exe apps\desktop\src-tauri\binaries\mist-x86_64-pc-windows-msvc.exe

      - name: Stage GStreamer for bundling
        shell: pwsh
        run: apps\desktop\scripts\stage-gstreamer.ps1 -Root $env:GST_ROOT

      - name: Build the installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.windows-installer.conf.json
          Get-ChildItem ..\..\target\release\bundle\nsis

      - name: Install silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          "installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB)) MB)"
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $mist = Get-ChildItem "C:\Program Files" -Recurse -Filter mist.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "gstreamer" } | Select-Object -First 1
          if (-not $mist) { throw "installed mist.exe not found" }
          $dir = $mist.DirectoryName
          "installed to $dir"
          Get-ChildItem $dir -File | Select-Object -First 15 Name
          "files: $((Get-ChildItem -Recurse -File $dir).Count)"
          "INSTALL_DIR=$dir" >> $env:GITHUB_ENV

      - name: Hide the system GStreamer
        shell: pwsh
        run: |
          # Rename the toolkit's install so only the bundled runtime can be found.
          Rename-Item (Split-Path (Split-Path $env:GST_ROOT)) "gstreamer-hidden"

      - name: Installed app diagnoses itself
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "gstreamer" }) -join ";"
          Remove-Item Env:GSTREAMER_1_0_ROOT_MSVC_X86_64 -ErrorAction SilentlyContinue
          & "$env:INSTALL_DIR\mist.exe" diagnose | Out-File -Encoding utf8 diagnose.txt
          if ($LASTEXITCODE -ne 0) { throw "mist diagnose failed ($LASTEXITCODE)" }
          $r = Get-Content diagnose.txt -Raw | ConvertFrom-Json
          "GStreamer: $($r.gstreamer)"
          $enc = @($r.encoders | Where-Object available | ForEach-Object element)
          $dec = @($r.decoders | Where-Object available | ForEach-Object element)
          "working encoders: $($enc -join ', ')"
          "working decoders: $($dec -join ', ')"
          if ($enc.Count -eq 0) { throw "the installed app found no working H.264 encoder" }
          if ($dec.Count -eq 0) { throw "the installed app found no working H.264 decoder" }

      - name: Installed app streams (end-to-end, test pattern)
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "gstreamer" }) -join ";"
          Remove-Item Env:GSTREAMER_1_0_ROOT_MSVC_X86_64 -ErrorAction SilentlyContinue
          $env:MIST_BIN_DIR = $env:INSTALL_DIR
          $env:MIST_SERVER_BIN_DIR = "$PWD\target\release"
          python tests/e2e/e2e.py --test-pattern --audio test-tone --duration 10 --gamepad-check
          if ($LASTEXITCODE -ne 0) { throw "end-to-end test (standalone server) failed" }
          # The default setup: the host runs its built-in server, the client
          # pairs with the host's address and pins its certificate.
          python tests/e2e/e2e.py --builtin-server --test-pattern --audio test-tone --duration 10
          if ($LASTEXITCODE -ne 0) { throw "end-to-end test (built-in server) failed" }

      - name: Installed app checks for and downloads an update (this private repo)
        shell: pwsh
        env:
          MIST_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "gstreamer" }) -join ";"
          $mist = "$env:INSTALL_DIR\mist.exe"
          # Pretend to be an old version so the newest release counts as an update.
          & $mist update check --current 0.0.1 | Tee-Object update.json
          if ($LASTEXITCODE -ne 0) { throw "update check failed" }
          $u = Get-Content update.json -Raw | ConvertFrom-Json
          if (-not $u.installer) { throw "the newest release has no installer" }
          "newest release: $($u.tag), installer $($u.installer.name), sha256 $($u.installer.sha256)"
          $path = & $mist update download --current 0.0.1 --dest "$env:RUNNER_TEMP\upd"
          if ($LASTEXITCODE -ne 0) { throw "update download/verification failed" }
          "downloaded and verified: $path"

      - name: Update-mode install over the existing installation
        shell: pwsh
        run: |
          # The same flags the app uses, minus /R (no restart on a CI runner).
          $installer = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          $p = Start-Process $installer.FullName -ArgumentList "/P", "/UPDATE" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "update install did not finish in 5 minutes" }
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "update install failed" }
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "gstreamer" }) -join ";"
          & "$env:INSTALL_DIR\mist.exe" diagnose | Out-File -Encoding utf8 diagnose-after-update.txt
          if ($LASTEXITCODE -ne 0) { throw "the app does not start after the update install" }
          $r = Get-Content diagnose-after-update.txt -Raw | ConvertFrom-Json
          "after update: $($r.app_version), $($r.gstreamer), encoders: $(@($r.encoders | Where-Object available | ForEach-Object element) -join ', ')"

      - uses: actions/upload-artifact@v4
        with:
          name: MistRemotePlay-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-output
          path: diagnose.txt
          if-no-files-found: ignore

  server:
    # Optional relay/signaling server for a Linux VPS, with deploy configs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - name: Build and package
        run: |
          cargo build --release -p mist-signaling-server
          d=mist-signaling-server-linux-x86_64
          mkdir -p $d
          cp target/release/mist-signaling-server $d/
          cp -r deploy/systemd deploy/coturn deploy/caddy deploy/examples $d/
          cp deploy/README.md docs/networking.md LICENSE-MIT LICENSE-APACHE $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: mist-signaling-server-linux-x86_64
          path: mist-signaling-server-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    # Only for tags (pushed, or requested when running the workflow by
    # hand), and only when the installer passed its tests.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [installer, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MistRemotePlay-windows-installer
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mist-signaling-server-linux-x86_64
          path: dist
      - name: Release notes and version check
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          version="$(python3 -c 'import json;print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          # The in-app updater compares versions; a tag that does not match
          # the built app would make it offer the same update forever.
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match the app version $version"; exit 1; }
          sed "s/{{VERSION}}/$version/g; s/{{TAG}}/$tag/g" .github/release-notes.md > release-notes.md
      - name: Checksums
        run: |
          cd dist
          for f in *; do n="$(echo "$f" | tr ' ' '.')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mist Remote Play ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          prerelease: true
          files: dist/*
