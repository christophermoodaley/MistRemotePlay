[package]
name = "mist-desktop"
description = "Mist Remote Play desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mist-app-core.workspace = true
mist-protocol.workspace = true
mist-diagnostics.workspace = true
mist-session-manager.workspace = true
mist-media-engine.workspace = true
mist-controller-api = { workspace = true, features = ["gilrs"] }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
