# coturn configuration for Mist Remote Play (TURN REST API / ephemeral credentials).
# The shared secret is NOT stored here: pass it with
#   turnserver -c /etc/turnserver.conf --static-auth-secret="$MIST_TURN_SECRET"
# (see docker-compose.yml) and give the same value to the signaling server
# as MIST_TURN_SECRET.

listening-port=3478
# TURN over TLS (turns:) for networks that only allow HTTPS-like traffic.
tls-listening-port=5349
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Replace with the server's public address(es). Behind 1:1 NAT (cloud VMs):
# external-ip=<public-ip>/<private-ip>
# external-ip=203.0.113.10

realm=mist.example.org
fingerprint
use-auth-secret
# static-auth-secret is supplied on the command line from the environment.

# Relay port range; open these UDP ports in the firewall.
min-port=49160
max-port=49999

# Hardening: never relay to private/loopback networks (prevents using the
# relay to reach the server's internal network).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Per-user quotas (one streaming session uses one allocation per peer).
user-quota=12
total-quota=1200
# Cap relayed bandwidth per session (bytes/s); 60 Mbit/s here.
max-bps=7500000

no-cli
no-tlsv1
no-tlsv1_1
simple-log
log-file=stdout
