[package]
name = "mist-capture-api"
description = "Screen capture backend interface and platform display discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wayland-portal"]
# xdg-desktop-portal ScreenCast (PipeWire) support for Wayland sessions.
wayland-portal = ["dep:ashpd", "dep:tokio"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "screencast"] }
tokio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
