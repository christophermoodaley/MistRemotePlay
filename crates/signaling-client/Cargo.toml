[package]
name = "mist-signaling-client"
description = "Authenticated WebSocket/TLS client for the Mist signaling service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mist-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
url.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
mist-signaling-server.workspace = true
anyhow.workspace = true
futures.workspace = true
rcgen = "0.13"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
