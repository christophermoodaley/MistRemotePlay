[package]
name = "mist-input-api"
description = "Validated, rate-limited remote input dispatch with platform injection backends"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mist-protocol.workspace = true
mist-controller-api = { workspace = true, default-features = false }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
evdev = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
